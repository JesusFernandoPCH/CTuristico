name = "fahp-concierge"
main = "src/index.js"
compatibility_date = "2026-10-01"

# src/catalog.json is generated from ../data/hotel.json and ../data.js on every build/deploy.
[build]
command = "node build-catalog.mjs"

[vars]
# Sites allowed to call the chat endpoint (comma separated).
ALLOWED_ORIGINS = "https://jesusfernandopch.github.io,http://127.0.0.1:8765,http://localhost:8765"
# "workers-ai": free daily quota on Cloudflare. "anthropic": Claude (needs the ANTHROPIC_API_KEY secret and credits).
PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODEL = "claude-opus-5-5"
EFFORT = "low"
# Small, cheap model that turns away off-topic messages before the main model runs. Empty disables it.
GUARD_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
# Messages per visitor (IP) per UTC day, so one person can't use up the shared free quota.
DAILY_LIMIT_PER_VISITOR = "30"

[ai]
binding = "AI"

# Per-visitor daily message counts.
[[kv_namespaces]]
binding = "CHAT_QUOTA"
id = "77873a124c2c4ec287ef46a59da8c92e"

# Per-visitor burst limit: 6 messages per minute (approximate, applied per Cloudflare location).
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# Only for PROVIDER = "anthropic": `npx wrangler secret put ANTHROPIC_API_KEY`
# (for `wrangler dev`, put it in .dev.vars, which is git-ignored).
