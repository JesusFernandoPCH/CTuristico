name = "fahp-concierge"
main = "src/index.js"
compatibility_date = "2026-10-01"

# src/catalog.json is generated from ../data/hotel.json and ../data.js on every build/deploy.
[build]
command = "node build-catalog.mjs"

[vars]
# Sites allowed to call the chat endpoint (comma separated).
ALLOWED_ORIGINS = "https://jesusfernandopch.github.io,http://127.0.0.1:8765,http://localhost:8765"
# "workers-ai": free daily quota on Cloudflare. "anthropic": Claude (needs the ANTHROPIC_API_KEY secret and credits).
PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODEL = "claude-opus-5-5"
EFFORT = "low"

[ai]
binding = "AI"

# Per-visitor limit: 10 messages per minute (approximate, applied per Cloudflare location).
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Only for PROVIDER = "anthropic": `npx wrangler secret put ANTHROPIC_API_KEY`
# (for `wrangler dev`, put it in .dev.vars, which is git-ignored).
